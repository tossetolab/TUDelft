name: Build & Deploy Slides (Marp)

on:
  push:
    branches: [ main ]
    paths:
      - "slides/**"
      - "publish/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Marp CLI
        run: npm i -g @marp-team/marp-cli

      - name: Build HTML slides
        run: |
          rm -rf dist
          mkdir -p dist/slides
          marp --input-dir slides \
            --html \
            --output dist/slides \
            --theme-set slides/theme/tossetolab.css

      - name: Copy static assets (images etc.) into dist
        run: |
          # Copy figures and other static files so relative links like "figs/sample.png" work on Pages
          rsync -av --prune-empty-dirs \
            --include='*/' \
            --include='*.png' --include='*.jpg' --include='*.jpeg' --include='*.gif' --include='*.svg' --include='*.webp' \
            --include='*.css' --include='*.js' \
            --exclude='*' \
            slides/ dist/slides/
            
      - name: Build PDF slides
        run: |
          mkdir -p dist/slides/pdf
          marp --input-dir slides \
            --pdf \
            --output dist/slides/pdf \
            --theme-set slides/theme/tossetolab.css

      - name: Generate slide index page
        run: |
          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          base_dir = Path("dist/slides")
          html_files = sorted(
              path for path in base_dir.rglob("*.html")
              if path.name != "index.html"
          )
          pdf_dir = base_dir / "pdf"

          def build_items(paths, base):
              items = []
              for path in paths:
                  relative = path.relative_to(base)
                  href = relative.as_posix()
                  label = relative.with_suffix("").as_posix()
                  items.append(
                      f'<li><a href="{escape(href)}">{escape(label)}</a></li>'
                  )
              return "\n".join(items) if items else "<li>No files generated.</li>"

          html_items = build_items(html_files, base_dir)
          pdf_items = build_items(sorted(pdf_dir.rglob("*.pdf")), base_dir)

          index_html = f"""<!DOCTYPE html>
          <html lang=\"en\">
          <head>
            <meta charset=\"utf-8\" />
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
            <title>TU Delft Slides</title>
            <style>
              :root {{
                color-scheme: light;
                --bg: #f5f3ec;
                --fg: #14213d;
                --muted: #5c677d;
                --card: #fffdf8;
                --accent: #fca311;
                --border: #d9d2c3;
              }}
              * {{ box-sizing: border-box; }}
              body {{
                margin: 0;
                font-family: Georgia, "Times New Roman", serif;
                background: linear-gradient(180deg, #efe8d8 0%, var(--bg) 100%);
                color: var(--fg);
              }}
              main {{
                max-width: 860px;
                margin: 0 auto;
                padding: 48px 20px 64px;
              }}
              h1, h2 {{
                font-weight: 600;
                letter-spacing: 0.02em;
              }}
              p {{ color: var(--muted); }}
              section {{
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 24px;
                box-shadow: 0 12px 30px rgba(20, 33, 61, 0.08);
              }}
              section + section {{ margin-top: 20px; }}
              ul {{ padding-left: 20px; margin: 0; }}
              li + li {{ margin-top: 10px; }}
              a {{ color: var(--fg); text-decoration-color: var(--accent); }}
              a:hover {{ color: #000; }}
            </style>
          </head>
          <body>
            <main>
              <h1>TU Delft Slides</h1>
              <p>Published slide decks and exported PDFs.</p>
              <section>
                <h2>HTML</h2>
                <ul>
                  {html_items}
                </ul>
              </section>
              <section>
                <h2>PDF</h2>
                <ul>
                  {pdf_items}
                </ul>
              </section>
            </main>
          </body>
          </html>
          """

          (base_dir / "index.html").write_text(index_html, encoding="utf-8")
          PY

      - name: Publish static files from publish/
        run: |
          pip install markdown --quiet
          python3 - <<'PY'
          import os
          import re
          import shutil
          from html import escape
          from pathlib import Path
          import markdown

          src = Path("publish")
          dst = Path("dist/publish")
          dst.mkdir(parents=True, exist_ok=True)

          if not src.exists():
              print("No publish/ folder found, skipping.")
              exit(0)

          for item in src.rglob("*"):
              rel = item.relative_to(src)
              target = dst / rel
              if item.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif item.suffix.lower() == ".md":
                  md_text = item.read_text(encoding="utf-8")
                  # Strip YAML front matter if present
                  md_body = re.sub(r"^---\n.*?\n---\n", "", md_text, count=1, flags=re.DOTALL)
                  title_match = re.search(r"^#\s+(.+)", md_body, re.MULTILINE)
                  title = title_match.group(1) if title_match else rel.stem
                  body_html = markdown.markdown(md_body, extensions=["tables", "fenced_code", "toc"])
                  html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>{escape(title)}</title>
            <style>
              body {{ max-width: 860px; margin: 40px auto; padding: 0 20px;
                     font-family: Georgia, serif; line-height: 1.7; color: #14213d; }}
              a {{ color: #14213d; text-decoration-color: #fca311; }}
              code {{ background: #f0ece3; padding: 2px 5px; border-radius: 3px; font-size: .92em; }}
              pre code {{ display: block; padding: 12px; overflow-x: auto; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #d9d2c3; padding: 6px 12px; }}
            </style>
          </head>
          <body>
          {body_html}
          </body>
          </html>"""
                  target.with_suffix(".html").write_text(html, encoding="utf-8")
              else:
                  shutil.copy2(item, target)

          print(f"Published {src} -> {dst}")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
